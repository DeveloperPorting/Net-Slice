name: Build Game

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

env:
  HAXE_VER: 4.3.7

jobs:
  Android:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VER }}

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin libwayland-dev libwayland-bin wayland-protocols libasound2-dev libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev libvulkan-dev pkg-config g++-multilib gcc-multilib

      - name: Setup hmm and libraries
        run: |
          haxelib --global install hmm --quiet
          haxelib --global run hmm setup
          haxelib run hmm install --quiet
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ../../project
          neko build.n
          cd ../../../..
          cd .haxelib/lime/git
          git submodule update --init --recursive
          cd ../../..
          haxelib run lime rebuild cpp -64 -release -clean
          haxelib run lime setup

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true

      - name: Compile
        run: haxelib run lime build android -release -D ${{ inputs.buildFlags }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Net Slice (Android)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  Windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true
          
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VER }}

      - name: Setup hmm and libraries
        shell: pwsh
        run: |
          function Run {
            $exe = $args[0]
            $cmdArgs = @()
            if ($args.Length -gt 1) {
              $cmdArgs = $args[1..($args.Length - 1)]
            }
            & $exe @cmdArgs
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          Run haxelib --global install hmm --quiet
          Run haxelib --global run hmm setup
          Run haxelib run hmm install --quiet
          Push-Location .haxelib/hxcpp/git/tools/hxcpp
          Run haxe compile.hxml
          Pop-Location
          Push-Location .haxelib/hxcpp/git/project
          Run neko build.n
          Pop-Location
          Push-Location .haxelib/lime/git
          Run git submodule update --init --recursive
          Pop-Location
          Run haxelib run lime rebuild cpp -64 -release -clean
          Run haxelib run lime setup

      - name: Compile
        run: haxelib run lime build windows -D ${{ inputs.buildFlags }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Net Slice (Windows)
          path: export/release/windows/bin

  Linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VER }}

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-13 g++-13 vlc libvlc-dev libvlccore-dev vlc-bin libwayland-dev libwayland-bin wayland-protocols libasound2-dev libpulse-dev libjack-jackd2-dev libpipewire-0.3-dev libgl1-mesa-dev libegl1-mesa-dev libglu1-mesa-dev libdbus-1-dev libudev-dev libxkbcommon-dev libx11-dev libxext-dev libx11-xcb-dev libxfixes-dev libxss-dev libxrender-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxxf86vm-dev libgbm-dev libdrm-dev libdecor-0-dev libvulkan-dev pkg-config g++-multilib gcc-multilib

      - name: Setup hmm and libraries
        run: |
          haxelib --global install hmm --quiet
          haxelib --global run hmm setup
          haxelib run hmm install --quiet
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ../../project
          neko build.n
          cd ../../../..
          cd .haxelib/lime/git
          git submodule update --init --recursive
          cd ../../..
          haxelib run lime rebuild cpp -64 -release -clean
          haxelib run lime setup

      - name: Compile
        run: haxelib run lime build Project.xml linux -D ${{ inputs.buildFlags }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Net Slice (Linux)
          path: export/release/linux/bin